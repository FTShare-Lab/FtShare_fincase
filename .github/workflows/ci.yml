name: Check financial cases
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  etf:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cases/etf
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cases/etf/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build:pages
      - run: npm run validate
      - run: npm run check:release
      - run: npm run deploy:check
      - run: docker build -t ftshare-etf-dashboard:ci .
      - run: npm run release:archive
  source-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/check-release.mjs
